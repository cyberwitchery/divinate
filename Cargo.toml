[package]
name = "divinate"
version = "0.0.1"
edition = "2021"
default-run = "divinate"
rust-version = "1.95"
license = "Apache-2.0"
description = "Answer technical compliance questions about a repository with evidence anyone can verify, and name the gap when the evidence cannot answer."
repository = "https://github.com/cyberwitchery/divinate"
homepage = "https://github.com/cyberwitchery/divinate"
documentation = "https://docs.rs/divinate"
readme = "README.md"
keywords = ["compliance", "audit", "security", "evidence", "provenance"]
categories = ["command-line-utilities", "development-tools"]

# the example corpus exceeds the crates.io package limit. its integration test is
# excluded with it. the sbom baseline and unsafe budget are ci inputs.
exclude = ["/dossiers/", "/tests/product.rs", "/sbom/", "/unsafe-budget.lock"]

[lib]
name = "divinate"

[[bin]]
name = "divinate"
path = "src/main.rs"

[[bin]]
name = "divinate-pack-github"
path = "packs/github/main.rs"

[[bin]]
name = "divinate-pack-azure-devops"
path = "packs/azure-devops/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix-url = "0.39"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev.package.sha2]
opt-level = 3
