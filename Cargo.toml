[package]
name = "divinate"
version = "0.0.1"
edition = "2021"
default-run = "divinate"
rust-version = "1.95"
license = "Apache-2.0"
description = "Keep a dated record of how software is developed and released, taken from the systems involved, with stated coverage and gaps."
repository = "https://github.com/cyberwitchery/divinate"
homepage = "https://github.com/cyberwitchery/divinate"
documentation = "https://docs.rs/divinate"
readme = "README.md"
keywords = ["compliance", "audit", "security", "evidence", "provenance"]
categories = ["command-line-utilities", "development-tools"]

exclude = ["/sbom/", "/unsafe-budget.lock"]

[lib]
name = "divinate"

[[bin]]
name = "divinate"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev.package.sha2]
opt-level = 3
